name: PR title

# Squash merges use the PR title as the commit message on main, and release-please reads those
# messages to pick the next version, so every PR title must be a Conventional Commit:
#   fix: ... -> patch     feat: ... -> minor     feat!: / BREAKING CHANGE -> major
#   chore: / docs: / ci: / style: / test: / refactor: -> no release

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: read

jobs:
    conventional:
        name: Conventional Commit title
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
